<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 เสืออ้วนนักทำนาย - ดูดวงไพ่ทาโร่สากล 10 ใบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .perspective { perspective: 1000px; }
        .card-inner { transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .tiger-bounce { animation: pulse-fast 1.2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-amber-950 text-amber-50 min-h-screen flex flex-col items-center p-3 sm:p-6">

    <div class="max-w-4xl w-full bg-amber-900/80 border-2 border-amber-500/40 rounded-3xl p-4 sm:p-8 shadow-2xl my-auto space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-block bg-amber-500 text-amber-950 px-4 py-1 rounded-full font-bold text-xs shadow-md">
                🐯 FAT TIGER STANDARD 10-CARD TAROT
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-amber-300 drop-shadow-md">
                🐯 เสืออ้วนนักทำนายพาทักดวง
            </h1>
            <p class="text-amber-200/80 text-sm">ถอดรหัสชะตาด้วยผังไพ่มาตรฐานสากล Celtic Cross (10 ใบ)</p>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-4 bg-amber-950/60 p-5 rounded-2xl border border-amber-600/30">
            
            <!-- ช่องใส่ ชื่อ/ชื่อเล่น, เพศ, และ วันเดือนปีเกิด -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-amber-300 uppercase mb-1">ชื่อ / ชื่อเล่น</label>
                    <input type="text" id="userName" placeholder="เช่น อู๋" 
                        class="w-full bg-amber-900 border border-amber-600 rounded-xl p-3 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-300 uppercase mb-1">เพศ</label>
                    <select id="userGender" class="w-full bg-amber-900 border border-amber-600 rounded-xl p-3 text-white focus:outline-none">
                        <option value="ไม่ระบุ">ไม่ระบุ</option>
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                        <option value="LGBTQ+">LGBTQ+</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-300 uppercase mb-1">วันเดือนปีเกิด</label>
                    <input type="text" id="userDob" placeholder="เช่น 1 ก.ค. 2524 / 01/07/1981" 
                        class="w-full bg-amber-900 border border-amber-600 rounded-xl p-3 text-white focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-amber-300 uppercase mb-1">หมวดหมู่เรื่องที่อยากรู้</label>
                <select id="category" class="w-full bg-amber-900 border border-amber-600 rounded-xl p-3 text-white focus:outline-none">
                    <option value="ดวงทั่วไป">🌟 ดวงทั่วไป / ทิศทางชีวิตภาพรวม</option>
                    <option value="ความรัก">💖 ความรัก / ความสัมพันธ์</option>
                    <option value="การงานและการเรียน">💼 การงาน / การเรียน / ธุรกิจ</option>
                    <option value="การเงินและโชคลาภ">💰 การเงิน / โชคลาภ / การลงทุน</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-amber-300 uppercase mb-1">คำถามของคุณ</label>
                <input type="text" id="question" placeholder="พิมพ์คำถามที่ต้องการคำตอบอย่างชัดเจน..." 
                    class="w-full bg-amber-900 border border-amber-600 rounded-xl p-3 text-white focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-amber-300 uppercase mb-1">รายละเอียดเพิ่มเติม (ระบุเพิ่มได้ถ้าต้องการ)</label>
                <textarea id="context" rows="2" placeholder="เช่น เพิ่งเปลี่ยนสายงานมาได้ 3 เดือน / กำลังลังเลระหว่างสองบริษัท..." 
                    class="w-full bg-amber-900 border border-amber-600 rounded-xl p-3 text-white focus:outline-none"></textarea>
            </div>

            <button onclick="drawCards()" id="submitBtn" 
                class="w-full bg-gradient-to-r from-amber-400 via-orange-500 to-amber-600 text-amber-950 font-bold text-lg py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                🐾 สับไพ่และเริ่มเปิดไพ่ 10 ใบ
            </button>
        </div>

        <!-- Cards Layout Zone -->
        <div id="cardsSection" class="hidden space-y-4">
            <h3 id="statusText" class="text-center font-bold text-amber-300 text-base">
                เสืออ้วนนักทำนายกำลังเปิดไพ่... 🐯
            </h3>
            <div id="cardsDisplay" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
        </div>

        <!-- Progress Loading Modal/Box (อนิเมชันนับถอยหลัง) -->
        <div id="loadingBox" class="hidden bg-amber-950/90 border-2 border-amber-500/60 rounded-2xl p-6 text-center space-y-4 shadow-xl">
            <div class="text-5xl tiger-bounce">🐯</div>
            <div class="space-y-1">
                <h4 id="loadingTitle" class="text-lg font-bold text-amber-300">กำลังเพ่งจิตถอดรหัสคำทำนาย...</h4>
                <p id="loadingSubtitle" class="text-xs text-amber-200/80">เสืออ้วนกำลังสื่อสารกับพลังงานของไพ่ทั้ง 10 ใบ</p>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-amber-900/80 rounded-full h-3.5 border border-amber-700/60 p-0.5 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-orange-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            
            <div class="text-xs font-mono text-amber-400 font-semibold" id="timerText">ประมาณเวลา 12 วินาที</div>
        </div>

        <!-- Result Box (แสดงคำทำนายทีละชุด) -->
        <div id="resultBox" class="hidden space-y-6">
            <div id="sectionsContainer" class="space-y-6"></div>

            <div class="text-center pt-2">
                <button id="nextBtn" onclick="showNextSection()" 
                    class="bg-gradient-to-r from-amber-400 to-orange-500 text-amber-950 font-bold text-base px-8 py-3.5 rounded-xl shadow-lg transition transform hover:scale-105 active:scale-95">
                    อ่านคำทำนายส่วนต่อไป 🐾
                </button>
            </div>
        </div>

    </div>

    <script>
        const cardBackImg = "images/card-back.jpg";
        const celticCrossPositions = [
            "ตำแหน่งที่ 1: สถานการณ์ปัจจุบัน", "ตำแหน่งที่ 2: อุปสรรค / สิ่งท้าทาย",
            "ตำแหน่งที่ 3: รากฐาน / อดีตที่ส่งผล", "ตำแหน่งที่ 4: อดีตที่เพิ่งผ่านพ้น",
            "ตำแหน่งที่ 5: ความคิด / เป้าหมาย", "ตำแหน่งที่ 6: อนาคตอันใกล้",
            "ตำแหน่งที่ 7: ทัศนคติของตนเอง", "ตำแหน่งที่ 8: อิทธิพลภายนอก",
            "ตำแหน่งที่ 9: ความหวังและความกลัว", "ตำแหน่งที่ 10: บทสรุปและผลลัพธ์"
        ];

        const tarotDeck = [
            { name: "The Fool", nameTh: "0. ไพ่เจ้าตัวยุ่งผู้เริ่มต้น", type: "Major Arcana", img: "images/cards/0_fool.jpg" },
            { name: "The Magician", nameTh: "I. ไพ่เสือวิเศษผู้มีพรสวรรค์", type: "Major Arcana", img: "images/cards/1_magician.jpg" },
            { name: "The High Priestess", nameTh: "II. ไพ่เสือหยินผู้มีสัญชาตญาณ", type: "Major Arcana", img: "images/cards/2_high_priestess.jpg" },
            { name: "The Empress", nameTh: "III. ไพ่แม่เสืออ้วนผู้อุดมสมบูรณ์", type: "Major Arcana", img: "images/cards/3_empress.jpg" },
            { name: "The Emperor", nameTh: "IV. ไพ่พญาเสือผู้ยิ่งใหญ่", type: "Major Arcana", img: "images/cards/4_emperor.jpg" },
            { name: "The Hierophant", nameTh: "V. ไพ่เสือฤาษีผู้ทรงศีล", type: "Major Arcana", img: "images/cards/5_hierophant.jpg" },
            { name: "The Lovers", nameTh: "VI. ไพ่คู่รักเสืออ้วนอินเลิฟ", type: "Major Arcana", img: "images/cards/6_lovers.jpg" },
            { name: "The Chariot", nameTh: "VII. ไพ่เสืออ้วนสู้ไม่ถอย", type: "Major Arcana", img: "images/cards/7_chariot.jpg" },
            { name: "Strength", nameTh: "VIII. ไพ่เสืออ้วนชนะใจตนเอง", type: "Major Arcana", img: "images/cards/8_strength.jpg" },
            { name: "The Hermit", nameTh: "IX. ไพ่เสือผู้ปลีกวิเวก", type: "Major Arcana", img: "images/cards/9_hermit.jpg" },
            { name: "Wheel of Fortune", nameTh: "X. ไพ่วกวนกงล้อโชคชะตา", type: "Major Arcana", img: "images/cards/10_wheel_of_fortune.jpg" },
            { name: "Justice", nameTh: "XI. ไพ่เสือความเที่ยงธรรม", type: "Major Arcana", img: "images/cards/11_justice.jpg" },
            { name: "The Hanged Man", nameTh: "XII. ไพ่เสืออ้วนห้อยหัวชิลๆ", type: "Major Arcana", img: "images/cards/12_hanged_man.jpg" },
            { name: "Death", nameTh: "XIII. ไพ่การสิ้นสุดเพื่อเริ่มใหม่", type: "Major Arcana", img: "images/cards/13_death.jpg" },
            { name: "Temperance", nameTh: "XIV. ไพ่เสือแห่งการปรับสมดุล", type: "Major Arcana", img: "images/cards/14_temperance.jpg" },
            { name: "The Devil", nameTh: "XV. ไพ่เสือติดกิเลสลุ่มหลง", type: "Major Arcana", img: "images/cards/15_devil.jpg" },
            { name: "The Tower", nameTh: "XVI. ไพ่พังทลายอย่างฉับพลัน", type: "Major Arcana", img: "images/cards/16_tower.jpg" },
            { name: "The Star", nameTh: "XVII. ไพ่ประกายดาวแห่งความหวัง", type: "Major Arcana", img: "images/cards/17_star.jpg" },
            { name: "The Moon", nameTh: "XVIII. ไพ่เงาจันทร์ความสับสน", type: "Major Arcana", img: "images/cards/18_moon.jpg" },
            { name: "The Sun", nameTh: "XIX. ไพ่เสือรับแดดสดใสเปี่ยมสุข", type: "Major Arcana", img: "images/cards/19_sun.jpg" },
            { name: "Judgement", nameTh: "XX. ไพ่การตื่นรู้และผลกรรม", type: "Major Arcana", img: "images/cards/20_judgement.jpg" },
            { name: "The World", nameTh: "XXI. ไพ่ความสำเร็จสมบูรณ์แบบ", type: "Major Arcana", img: "images/cards/21_world.jpg" },
            ...["Ace", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Page", "Knight", "Queen", "King"].map(val => ({
                name: `${val} of Wands`, nameTh: `ไพ่ ${val} ไม้เท้า`, type: "Minor Arcana (Wands)", img: `images/cards/wands_${val.toLowerCase()}.jpg`
            })),
            ...["Ace", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Page", "Knight", "Queen", "King"].map(val => ({
                name: `${val} of Cups`, nameTh: `ไพ่ ${val} ถ้วย`, type: "Minor Arcana (Cups)", img: `images/cards/cups_${val.toLowerCase()}.jpg`
            })),
            ...["Ace", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Page", "Knight", "Queen", "King"].map(val => ({
                name: `${val} of Swords`, nameTh: `ไพ่ ${val} ดาบ`, type: "Minor Arcana (Swords)", img: `images/cards/swords_${val.toLowerCase()}.jpg`
            })),
            ...["Ace", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Page", "Knight", "Queen", "King"].map(val => ({
                name: `${val} of Pentacles`, nameTh: `ไพ่ ${val} เหรียญ`, type: "Minor Arcana (Pentacles)", img: `images/cards/pentacles_${val.toLowerCase()}.jpg`
            }))
        ];

        let drawnCards = [];
        let fetchedSections = [];
        let currentSectionIndex = 0;
        let progressInterval = null;

        async function drawCards() {
            const userName = document.getElementById('userName').value.trim();
            const userGender = document.getElementById('userGender').value;
            const userDob = document.getElementById('userDob').value.trim();
            const question = document.getElementById('question').value.trim();
            const category = document.getElementById('category').value;
            const context = document.getElementById('context').value.trim();

            if (!question) {
                alert("กรุณาพิมพ์คำถามให้เสืออ้วนนักทำนายทราบก่อนครับ 🐯");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const cardsSection = document.getElementById('cardsSection');
            const cardsDisplay = document.getElementById('cardsDisplay');
            const loadingBox = document.getElementById('loadingBox');
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');

            const shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
            drawnCards = celticCrossPositions.map((pos, idx) => ({ position: pos, ...shuffled[idx] }));

            cardsSection.classList.remove('hidden');
            resultBox.classList.add('hidden');
            loadingBox.classList.add('hidden');
            statusText.innerText = "เสืออ้วนนักทำนายกำลังค่อยๆ พลิกเปิดไพ่ทีละใบ... 🐯";

            cardsDisplay.innerHTML = drawnCards.map((card, idx) => `
                <div class="perspective">
                    <div id="card-inner-${idx}" class="card-inner relative w-full h-64 rounded-xl shadow-lg">
                        <div class="card-front absolute inset-0 bg-amber-800 border-2 border-amber-400 rounded-xl flex flex-col items-center justify-center p-2 text-center overflow-hidden">
                            <img src="${cardBackImg}" class="absolute inset-0 w-full h-full object-cover opacity-40" onerror="this.style.display='none'">
                            <div class="relative z-10 space-y-1">
                                <span class="text-3xl">🐯</span>
                                <div class="text-[11px] text-amber-300 font-bold leading-tight">${card.position}</div>
                            </div>
                        </div>
                        <div class="card-back absolute inset-0 bg-amber-900 border-2 border-amber-300 rounded-xl flex flex-col justify-between p-2 overflow-hidden">
                            <div class="text-[10px] text-amber-300 font-bold text-center leading-tight">${card.position}</div>
                            <div class="h-36 rounded-lg overflow-hidden my-1 border border-amber-500/50 bg-amber-950/50 flex items-center justify-center">
                                <img src="${card.img}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-3xl\'>🐯</div>';">
                            </div>
                            <div class="text-center">
                                <div class="text-xs font-bold text-amber-200 truncate">${card.nameTh}</div>
                                <div class="text-[9px] text-amber-400/80 truncate">${card.type}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            btn.disabled = true;
            btn.innerText = "🔮 กำลังเปิดไพ่ตามผัง...";

            for (let i = 0; i < 10; i++) {
                await new Promise(r => setTimeout(r, 350));
                flipCard(i);
            }

            statusText.innerText = "เปิดไพ่ครบทั้ง 10 ใบเรียบร้อยแล้ว! 🌟";

            loadingBox.classList.remove('hidden');
            loadingBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            startProgressAnimation();

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, question, userName, userGender, userDob, context, drawnCards })
                });

                const data = await res.json();
                stopProgressAnimation();

                if (res.ok && data.sections) {
                    fetchedSections = data.sections;
                    currentSectionIndex = 0;
                    loadingBox.classList.add('hidden');
                    resultBox.classList.remove('hidden');
                    document.getElementById('sectionsContainer').innerHTML = '';
                    showNextSection();
                } else {
                    alert(`เกิดข้อผิดพลาด: ${data.error || 'ไม่สามารถรับคำทำนายได้'}`);
                }
            } catch (err) {
                stopProgressAnimation();
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบคำทำนาย");
            } finally {
                btn.disabled = false;
                btn.innerText = "🐾 สับไพ่และเริ่มเปิดไพ่ 10 ใบ";
            }
        }

        function startProgressAnimation() {
            let secondsLeft = 12;
            let percent = 0;
            const progressBar = document.getElementById('progressBar');
            const timerText = document.getElementById('timerText');
            const loadingSubtitle = document.getElementById('loadingSubtitle');

            const messages = [
                "เสืออ้วนกำลังเปิดตำราอ่านพลังงาน...",
                "กำลังคำนวณวันเกิดและสัญชาตญาณ...",
                "กำลังกลั่นกรองคำแนะนำสำหรับคุณ...",
                "ใกล้เสร็จแล้ว เสืออ้วนกำลังเรียบเรียงตัวอักษร..."
            ];

            progressInterval = setInterval(() => {
                percent += 8;
                secondsLeft = Math.max(0, secondsLeft - 1);
                
                if (percent > 92) percent = 92;
                progressBar.style.width = percent + '%';
                timerText.innerText = `กำลังประมวลผล... (เหลือเวลาประมาณ ${secondsLeft} วินาที)`;
                
                let msgIdx = Math.floor((100 - percent) / 25);
                loadingSubtitle.innerText = messages[Math.min(msgIdx, messages.length - 1)];
            }, 800);
        }

        function stopProgressAnimation() {
            if (progressInterval) clearInterval(progressInterval);
            document.getElementById('progressBar').style.width = '100%';
        }

        function showNextSection() {
            if (currentSectionIndex >= fetchedSections.length) return;

            const sec = fetchedSections[currentSectionIndex];
            const container = document.getElementById('sectionsContainer');

            let sectionCards = [];
            if (currentSectionIndex === 0) sectionCards = drawnCards.slice(0, 3);
            else if (currentSectionIndex === 1) sectionCards = drawnCards.slice(3, 6);
            else if (currentSectionIndex === 2) sectionCards = drawnCards.slice(6, 9);
            else if (currentSectionIndex === 3) sectionCards = drawnCards.slice(9, 10);

            const cardsHtml = `
                <div class="grid ${sectionCards.length === 1 ? 'grid-cols-1 max-w-xs mx-auto' : 'grid-cols-3'} gap-2.5 my-3">
                    ${sectionCards.map(card => `
                        <div class="bg-amber-900/80 border border-amber-500/40 rounded-xl p-2 text-center shadow-md">
                            <div class="text-[10px] sm:text-xs text-amber-300 font-bold leading-tight mb-1 truncate">${card.position.split(':')[0]}</div>
                            <div class="h-28 sm:h-36 rounded-lg overflow-hidden border border-amber-500/40 bg-amber-950 flex items-center justify-center">
                                <img src="${card.img}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-3xl\'>🐯</div>';">
                            </div>
                            <div class="text-xs font-bold text-amber-100 truncate mt-1.5">${card.nameTh}</div>
                            <div class="text-[9px] text-amber-400/80 truncate">${card.type}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            const sectionCard = document.createElement('div');
            sectionCard.className = 'bg-amber-950/90 border-2 border-amber-400/50 rounded-2xl p-5 sm:p-6 text-amber-100 leading-relaxed space-y-3 shadow-xl transform transition-all duration-500 opacity-0 translate-y-4';
            
            sectionCard.innerHTML = `
                <div class="flex items-center space-x-2 border-b border-amber-800/80 pb-2">
                    <span class="text-xl">📜</span>
                    <h3 class="font-bold text-amber-300 text-base sm:text-lg">${sec.title}</h3>
                </div>
                
                ${cardsHtml}

                <div class="bg-amber-500/15 border border-amber-400/40 rounded-xl p-3.5 text-amber-200 text-xs sm:text-sm font-semibold flex items-start space-x-2">
                    <span class="text-base leading-none">⚡️</span>
                    <div>
                        <span class="text-amber-300 font-bold uppercase">สรุปใจความสำคัญ:</span>
                        <span>${sec.summary}</span>
                    </div>
                </div>

                <div class="text-sm sm:text-base text-amber-100/95 whitespace-pre-line pt-1">
                    ${sec.content}
                </div>
            `;

            container.appendChild(sectionCard);

            setTimeout(() => {
                sectionCard.classList.remove('opacity-0', 'translate-y-4');
                sectionCard.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 50);

            currentSectionIndex++;

            const nextBtn = document.getElementById('nextBtn');
            if (currentSectionIndex >= fetchedSections.length) {
                nextBtn.innerText = "✨ อ่านคำทำนายครบแล้ว (เปิดดวงใหม่กดปุ่มด้านบน)";
                nextBtn.disabled = true;
                nextBtn.classList.add('opacity-60', 'cursor-not-allowed');
            } else {
                nextBtn.innerText = `อ่านคำทำนายส่วนต่อไป (${currentSectionIndex + 1}/${fetchedSections.length}) 🐾`;
            }
        }

        function flipCard(index) {
            const el = document.getElementById(`card-inner-${index}`);
            if (el) el.classList.add('card-flipped');
        }
    </script>
</body>
</html>
